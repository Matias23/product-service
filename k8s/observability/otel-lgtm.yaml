apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-lgtm
  template:
    metadata:
      labels:
        app: otel-lgtm
    spec:
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.11.10
          env:
            - name: GF_SMTP_ENABLED
              value: "true"
            - name: GF_SMTP_HOST
              value: mailpit:1025
            - name: GF_SMTP_FROM_ADDRESS
              value: grafana@product-service.local
            - name: GF_SMTP_FROM_NAME
              value: Grafana product-service
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: alerting
              mountPath: /otel-lgtm/grafana/conf/provisioning/alerting
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: alerting
          configMap:
            name: grafana-alerting
---
# Internal: apps send OTLP here (otel-lgtm.platform.svc.cluster.local:4318)
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
  namespace: platform
spec:
  selector:
    app: otel-lgtm
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
# External: Grafana UI on the host at localhost:3000
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: platform
spec:
  type: NodePort
  selector:
    app: otel-lgtm
  ports:
    - name: http
      port: 3000
      targetPort: grafana
      nodePort: 30300
