kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: products
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # Kong proxy NodePort
        hostPort: 8000
      - containerPort: 30081   # Keycloak NodePort (keeps the issuer http://localhost:8081)
        hostPort: 8081
      - containerPort: 30300   # Grafana NodePort
        hostPort: 3000
  - role: worker
  - role: worker
