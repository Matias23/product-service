apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: correlation-id
  namespace: products
plugin: correlation-id
config:
  header_name: X-Request-ID
  generator: uuid
  echo_downstream: true
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: rate-limit-per-ip
  namespace: products
plugin: rate-limiting
config:
  minute: 5
  limit_by: ip
  policy: local
  fault_tolerant: true
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: opentelemetry
  namespace: products
plugin: opentelemetry
config:
  traces_endpoint: http://otel-lgtm.platform.svc.cluster.local:4318/v1/traces
  logs_endpoint: http://otel-lgtm.platform.svc.cluster.local:4318/v1/logs
  resource_attributes:
    service.name: kong-gateway
  propagation:
    default_format: w3c
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: key-auth
  namespace: products
plugin: key-auth
config:
  key_names: ["apikey"]
  hide_credentials: true
  anonymous: anonymous
