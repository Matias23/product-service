name: product-service

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./k8s/keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@product-service.local
      GF_SMTP_FROM_NAME: Grafana product-service
    volumes:
      - ./k8s/observability/grafana/alerting/product-service-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/product-service-alerts.yaml:ro
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "8025:8025"   # Web inbox UI
      - "1025:1025"   # SMTP

  product-service:
    build: .
    image: product-service:0.1.0
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/products
      DB_USER: products
      DB_PASSWORD: products
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/product-service
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/product-service/protocol/openid-connect/certs
      OTLP_ENDPOINT: http://otel-lgtm:4318
    ports:
      - "8080:8080"
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "products", "-d", "products"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
