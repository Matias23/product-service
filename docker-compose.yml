name: product-service

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@product-service.local
      GF_SMTP_FROM_NAME: Grafana product-service
    volumes:
      - ./docker/grafana/alerting/product-service-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/product-service-alerts.yaml:ro
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "8025:8025"   # Web inbox UI
      - "1025:1025"   # SMTP
